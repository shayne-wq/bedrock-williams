<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Bedrock — graphics diagnostic</title>
<script>window.CESIUM_BASE_URL='https://cdn.jsdelivr.net/npm/cesium@1.120/Build/Cesium/';</script>
<link href="https://cdn.jsdelivr.net/npm/cesium@1.120/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
<style>
  body{margin:0;background:#07090A;color:#EDEEEC;font:15px/1.55 -apple-system,system-ui,sans-serif;
       padding:26px 18px 60px}
  h1{font-size:19px;margin:0 0 4px}
  p.s{color:#8E948E;font-size:13px;margin:0 0 22px}
  .t{border-top:1px solid rgba(255,255,255,.12);padding:14px 0}
  .n{font:11px ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase;color:#8E948E}
  .r{margin-top:6px;font:12.5px/1.5 ui-monospace,monospace;word-break:break-word}
  .ok{color:#7FC98B} .bad{color:#E08C72} .wait{color:#8E948E}
  #stage{width:100%;height:190px;margin-top:10px;background:#0D1012;border-radius:3px;overflow:hidden}
  button{margin-top:24px;font:12px ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;
    background:#C99A3A;color:#12100B;border:0;border-radius:3px;padding:13px 18px;width:100%}
</style>
<h1>Bedrock graphics diagnostic</h1>
<p class="s">Four tests, hardest last. Send the whole result back.</p>
<div id="out"></div>
<div id="stage"></div>
<button onclick="copyAll()">Copy result</button>
<script src="https://cdn.jsdelivr.net/npm/cesium@1.120/Build/Cesium/Cesium.js"></script>
<script type="module">
// The driver's own reason for a refusal, which Cesium otherwise swallows.
let ctxReason = '';
document.addEventListener('webglcontextcreationerror',
  e => { ctxReason = e.statusMessage || '(no message)'; }, true);

const out = document.getElementById('out');
const lines = [];
function row(name, cls, text) {
  lines.push(name + ': ' + text);
  out.insertAdjacentHTML('beforeend',
    `<div class="t"><div class="n">${name}</div><div class="r ${cls}">${text}</div></div>`);
}
function copyAll() {
  const t = 'Bedrock diag\n' + lines.join('\n');
  navigator.clipboard?.writeText(t).then(
    () => alert('Copied. Paste it back.'), () => prompt('Copy this:', t));
}

// 1 & 2 — raw contexts. Not "did getContext return an object" but "does the
// context answer", which is the distinction the whole investigation turned on.
for (const kind of ['webgl2', 'webgl']) {
  let c = null, gl = null;
  try {
    c = document.createElement('canvas'); c.width = c.height = 64;
    gl = c.getContext(kind, { failIfMajorPerformanceCaveat: false });
    if (!gl) { row(kind, 'bad', 'no context'); }
    else {
      const dims = gl.getParameter(gl.MAX_VIEWPORT_DIMS);
      const tex  = gl.getParameter(gl.MAX_TEXTURE_SIZE);
      const dbg  = gl.getExtension('WEBGL_debug_renderer_info');
      const ren  = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : '(renderer hidden)';
      row(kind, dims ? 'ok' : 'bad',
        gl.isContextLost() ? 'LOST on creation'
        : !dims ? 'DEAD — getParameter returns null'
        : `live · viewport ${dims[0]}x${dims[1]} · maxTexture ${tex} · ${ren}`);
    }
  } catch (e) { row(kind, 'bad', 'threw: ' + ((e && e.message) || e)); }
  finally { try { gl && gl.getExtension('WEBGL_lose_context')?.loseContext(); } catch {} }
}

row('device', 'wait', `${innerWidth}x${innerHeight} @${devicePixelRatio}x · ` +
  `${navigator.hardwareConcurrency || '?'} cores · ${navigator.deviceMemory || '?'} GB reported`);

// 3 — the smallest possible Cesium: no terrain, no imagery, no data.
let v3 = null;
try {
  v3 = new Cesium.Viewer('stage', {
    imageryProvider: false, terrainProvider: new Cesium.EllipsoidTerrainProvider(),
    baseLayerPicker:false, geocoder:false, homeButton:false, sceneModePicker:false,
    navigationHelpButton:false, animation:false, timeline:false, fullscreenButton:false,
    infoBox:false, selectionIndicator:false, showRenderLoopErrors:false,
    contextOptions:{ webgl:{ powerPreference:'default', antialias:false, alpha:false } },
  });
  row('cesium · bare globe', 'ok', 'STARTED — WebGL is fine; the deck is what is heavy');
} catch (e) {
  row('cesium · bare globe', 'bad', 'FAILED — ' + ((e && e.message) || e) +
      (ctxReason ? ' [driver: ' + ctxReason + ']' : ''));
}

// 4 — the same thing the deck asks for: real terrain and satellite imagery.
if (v3) {
  try { v3.destroy(); } catch {}
  document.getElementById('stage').innerHTML = '';
  try {
    const im = await Cesium.ArcGisMapServerImageryProvider.fromUrl(
      'https://services.arcgisonline.com/arcgis/rest/services/World_Imagery/MapServer');
    const te = await Cesium.ArcGISTiledElevationTerrainProvider.fromUrl(
      'https://elevation3d.arcgis.com/arcgis/rest/services/WorldElevation3D/Terrain3D/ImageServer');
    const v4 = new Cesium.Viewer('stage', {
      baseLayer: new Cesium.ImageryLayer(im), terrainProvider: te,
      baseLayerPicker:false, geocoder:false, homeButton:false, sceneModePicker:false,
      navigationHelpButton:false, animation:false, timeline:false, fullscreenButton:false,
      infoBox:false, selectionIndicator:false, showRenderLoopErrors:false,
      contextOptions:{ webgl:{ powerPreference:'default', antialias:false, alpha:false } },
    });
    v4.camera.flyTo({ destination: Cesium.Cartesian3.fromDegrees(-127.77, 57.79, 30000),
                      duration: 0 });
    row('cesium · terrain + imagery', 'ok', 'STARTED — you should see the Toodoggone below');
  } catch (e) {
    row('cesium · terrain + imagery', 'bad', 'FAILED — ' + ((e && e.message) || e) +
        (ctxReason ? ' [driver: ' + ctxReason + ']' : ''));
  }
}
</script>

    $$('ad_ch').textContent = `${cur + 1}/${CH.length}` + (CAM_LOCK[cur] ? ' · locked' : '');
    $$('ad_now').textContent =
      `${c.lat.toFixed(4)}, ${c.lon.toFixed(4)}\n${c.height.toLocaleString()} m · ` +
      `hdg ${c.heading.toFixed(0)}° · pitch ${c.pitch.toFixed(0)}°`;
    if (document.activeElement && document.activeElement.closest('#admin') &&
        /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;   // do not fight the typist
    $$('ad_ey').value = chText(cur, 'ey');
    $$('ad_t').value  = chText(cur, 't');
    $$('ad_b').value  = chText(cur, 'b');
  };
  scene.camera.changed.addEventListener(refresh);
  scene.camera.percentageChanged = 0.02;
  window.__adminRefresh = refresh;

  const edit = (field, el) => el.addEventListener('input', () => {
    TXT_LOCK[cur] = { ...(TXT_LOCK[cur] || {}), [field]: el.value };
    saveTxt();
    // Repaint the caption live rather than on slide change — an editor that
    // only shows its result after you leave is one you cannot judge by.
    $('#cap_e').textContent = chText(cur, 'ey');
    $('#cap_t').textContent = chText(cur, 't');
    $('#cap_b').textContent = chText(cur, 'b');
    $$('ad_msg').textContent = 'Text saved for this slide.';
  });
  edit('ey', $$('ad_ey')); edit('t', $$('ad_t')); edit('b', $$('ad_b'));

  $$('ad_lock').onclick = () => {
    CAM_LOCK[cur] = readCamera(); saveCam(); refresh();
    $$('ad_msg').textContent = `Slide ${cur + 1} camera locked.`;
  };
  $$('ad_clear').onclick = () => {
    delete CAM_LOCK[cur]; saveCam(); refresh(); go(cur);
    $$('ad_msg').textContent = `Slide ${cur + 1} back to its built-in camera.`;
  };
  $$('ad_revert').onclick = () => {
    delete TXT_LOCK[cur]; saveTxt(); refresh(); go(cur);
    $$('ad_msg').textContent = `Slide ${cur + 1} text restored.`;
  };
  $$('ad_reset').onclick = () => {
    if (!confirm('Discard every camera lock and text edit?')) return;
    CAM_LOCK = {}; TXT_LOCK = {}; saveCam(); saveTxt(); refresh(); go(cur);
    $$('ad_msg').textContent = 'All edits discarded.';
  };
  $$('ad_copy').onclick = () => {
    const lit = o => '{\n' + Object.keys(o).sort((a, b) => a - b)
      .map(k => `  ${k}: ${JSON.stringify(o[k])},`).join('\n') + '\n}';
    const txt = `const CAM_FIXED = ${lit(CAM_LOCK)};\n\nconst TEXT_FIXED = ${lit(TXT_LOCK)};`;
    navigator.clipboard?.writeText(txt).then(
      () => { $$('ad_msg').textContent = 'Copied — paste over CAM_FIXED and TEXT_FIXED in index.html.'; },
      () => prompt('Paste these into index.html:', txt));
  };
  $$('ad_close').onclick = () => toggleEditor(false);
  refresh();
}

let editorOpen = false;
function toggleEditor(on) {
  editorOpen = on ?? !editorOpen;
  const rail = document.getElementById('rail');
  if (editorOpen) {
    if (!document.getElementById('admin')) editorUI();
    document.getElementById('admin').style.display = 'block';
    if (rail) rail.style.top = '520px';
  } else {
    const a = document.getElementById('admin'); if (a) a.style.display = 'none';
    if (rail) rail.style.top = '118px';
  }
  const b = document.getElementById('editbtn');
  if (b) b.setAttribute('aria-pressed', String(editorOpen));
  render();
}

/* ---- transitions -------------------------------------------------------- */
/* Duration from distance, not a constant: a 12 km establishing move and a
   400 m nudge cannot share one flight time, and shortest-arc on the heading so
   350° → 10° does not whip-pan the long way round. */
let cur = -1, playing = false, timer = null, frozenOnce = false;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

function flightTime(from, to) {
  if (REDUCED) return 0;
  const d = Cesium.Cartesian3.distance(from, to);
  return Math.min(4.2, Math.max(1.2, 1.1 + d / 4200));
}

/* A chapter declares the point it is about and how far back to stand, and the
   camera position is derived. Declaring the position instead means every pitch
   change silently re-aims the shot: at -42° and 16 km back, the subject is 18 km
   in front of the camera, and chapter one framed the ridge north of the claims. */
/* The centre of the canvas is not the centre of what anyone can see. A chapter
   rail holds the left ~240 px and a caption card holds the right ~470 px, so a
   subject aimed at the geometric centre lands under the paragraph describing
   it — the T-Bill zone was half behind its own caption on three chapters.

   Rather than nudge fourteen cameras by hand, the AIM POINT is shifted
   screen-right by the difference between the canvas centre and the clear
   area's centre, which puts the subject in the middle of the visible gap. The
   shift is in metres on the ground, derived from the range and the field of
   view, so it holds at 1.5 km and at 190 km. */
function aimShift(range, cards, pitchDeg) {
  const w = scene.canvas.clientWidth, h = scene.canvas.clientHeight;
  if (w < 900) return { x: 0, y: 0 };            // stacked layout: no side strips
  const fovX = scene.camera.frustum.fov;
  const fovY = 2 * Math.atan(Math.tan(fovX / 2) / (w / h));

  // Horizontal: the chapter rail holds the left, the caption the right, and a
  // chapter showing grade callouts needs another card-width of room because
  // they all extend leftward from their anchors.
  const clearL = 264 + (cards ? 300 : 0), clearR = w - 500;
  const px = w / 2 - (clearL + clearR) / 2;
  const x = (px / w) * (2 * range * Math.tan(fovX / 2));

  // Vertical: the caption fills the bottom right and the legends the bottom
  // left, so the clear band ends well above the canvas centre. Ground distance
  // per screen pixel grows as the camera flattens, hence the sin(pitch) term —
  // at -14° a hundred pixels is four times the ground it covers at -60°.
  const clearT = 96, clearB = h - 420;
  const py = h / 2 - (clearT + clearB) / 2;      // >0 → subject must move up
  // The DESTINATION's pitch, not the camera's current one. aimShift runs before
  // the flight, so reading the live camera measured the chapter you are leaving:
  // arriving at slide 12 (-48°) from slide 11 (-15°) scaled the vertical shift
  // by sin(15°) instead of sin(48°) — nearly three times too far, and the claim
  // block left the top of the frame. Worse than wrong, it was NON-DETERMINISTIC:
  // the same slide framed differently depending on which slide you came from,
  // which is why jumping straight to it in a test looked correct.
  const pitch = Math.abs(Cesium.Math.toRadians(pitchDeg)) || Math.PI / 4;
  const y = (py / h) * (2 * range * Math.tan(fovY / 2)) / Math.max(0.25, Math.sin(pitch));
  return { x, y };
}

function frameFor(c, shift) {
  let lon = c.cam.lon, lat = c.cam.lat;
  if (shift) {
    const m = aimShift(c.cam.range, (c.layers || []).includes('picks'), c.cam.pitch);
    // Screen-right on the ground is the heading turned 90°; screen-up is the
    // heading reversed, because a subject BEYOND the aim point rides higher in
    // frame. Both are applied to the aim point, never to the camera.
    const br = Cesium.Math.toRadians(c.cam.heading + 90);
    const bu = Cesium.Math.toRadians(c.cam.heading + 180);
    const north = m.x * Math.cos(br) + m.y * Math.cos(bu);
    const east  = m.x * Math.sin(br) + m.y * Math.sin(bu);
    lat += north / 111320;
    lon += east / (111320 * Math.cos(lat * Math.PI / 180));
  }
  const target = cart(lon, lat, c.cam.alt ?? 1500);
  return { target, offset: new Cesium.HeadingPitchRange(
    Cesium.Math.toRadians(c.cam.heading), Cesium.Math.toRadians(c.cam.pitch), c.cam.range) };
}

async function go(i, establish) {
  if (i < 0 || i >= CH.length) return;
  const c = CH[i], prev = cur; cur = i;

  // Layers are armed BEFORE the camera moves, so the destination is drawn on
  // arrival rather than popping into existence once the flight has landed.
  const on = new Set(c.layers || []);
  for (const k of Object.keys(L)) setLayer(k, on.has(k));
  if (window.__adminRefresh) setTimeout(window.__adminRefresh, 60);
  if (L.claims.nameplate) L.claims.nameplate(!!c.nameplate);
  if (L.holes.hush) L.holes.hush(on.has('picks'));
  if (L.holes.only) L.holes.only(c.zone || null);
  syncLays(on);
  await showGeo(c.geo || null); syncGeo();
  ground(c.ground ?? 1);
  legend(c.legend);
  zoneKey((c.layers||[]).includes('zones') || (c.layers||[]).includes('holes'));
  if (L.zones.labels) {
    L.zones.labels(!on.has('soil') && !on.has('rock') && !on.has('picks'), c.zone);
    L.zones.fill(!c.geo);
  }

  $('#cap_e').textContent = chText(i, 'ey');
  $('#cap_t').textContent = chText(i, 't');
  $('#cap_b').textContent = chText(i, 'b');
  $('#cap_f').innerHTML = (c.fig || []).map(([v,l]) => `<div><b>${v}</b><span>${l}</span></div>`).join('');
  $('#count').textContent = `${i+1} / ${CH.length}`;
  document.querySelectorAll('#rail button').forEach((b, n) =>
    b.setAttribute('aria-current', String(n === i)));

  // The district layout is solved on arrival at the opening frame and then
  // held. Freezing before the camera lands would solve it for a frame nobody
  // sees.
  const settle = () => {
    if (i === 0 && !frozenOnce) {
      frozenOnce = true; render();
      setTimeout(() => { freezeDistrict(); render(); }, 400);
    }
    // Labels are solved on arrival, once. Solving during the flight places them
    // for a frame nobody sees; solving every frame is the sliding the district
    // map was frozen to stop.
    setTimeout(declutterLabels, 120);
  };
  const lock = CAM_LOCK[i];
  const { target, offset } = lock ? { target: null, offset: null } : frameFor(c, true);
  if (establish && c.from && !REDUCED) {
    const f = frameFor({ cam: c.from }, true);
    viewer.camera.lookAt(f.target, f.offset);
    viewer.camera.lookAtTransform(Cesium.Matrix4.IDENTITY);
    // Wait for the frame to actually be drawn before flying out of it. A fixed
    // delay is a guess about someone else's network; `tilesLoaded` is the
    // answer. Capped, because a deck that will not open until the last tile
    // arrives is a deck that does not open.
    render();
    await new Promise(done => {
      const t0 = Date.now();
      const tick = () => {
        if (scene.globe.tilesLoaded || Date.now() - t0 > 6000) return done();
        render(); requestAnimationFrame(tick);
      };
      tick();
    });
    await new Promise(r => setTimeout(r, 900));   // beat to read it
  }
  const dur = establish ? (c.from && !REDUCED ? 4.8 : 0)
    : flightTime(scene.camera.positionWC,
                 target || cart(lock.lon, lock.lat, lock.height));
  if (lock) {
    // A locked camera is flown to directly — no bounding sphere, no aim shift.
    viewer.camera.flyTo({
      destination: cart(lock.lon, lock.lat, lock.height),
      orientation: { heading: Cesium.Math.toRadians(lock.heading),
                     pitch: Cesium.Math.toRadians(lock.pitch),
                     roll: Cesium.Math.toRadians(lock.roll || 0) },
      duration: dur, easingFunction: Cesium.EasingFunction.QUADRATIC_IN_OUT,
      complete: settle });
  } else {
    viewer.camera.flyToBoundingSphere(new Cesium.BoundingSphere(target, 1), {
      offset, duration: dur, easingFunction: Cesium.EasingFunction.QUADRATIC_IN_OUT,
      complete: settle });
  }
  if (dur === 0) settle();      // an instant move fires no completion callback
  render();

  prefetch(CH[i + 1]);
  if (playing) { clearTimeout(timer); timer = setTimeout(() =>
    cur < CH.length - 1 ? go(cur + 1) : setPlay(false), (dur + 7.5) * 1000); }
}

function setPlay(v) {
  playing = v; $('#play').setAttribute('aria-pressed', String(v));
  $('#play').textContent = v ? 'Pause' : 'Play';
  clearTimeout(timer);
  if (v) timer = setTimeout(() => cur < CH.length - 1 ? go(cur + 1) : setPlay(false), 7500);
}

window.__go = go;
Object.defineProperty(window, 'geoOn', { get: () => geoOn });
{
  const btn = $('#layers'), pan = $('#panel');
  const setOpen = v => { pan.classList.toggle('open', v);
    btn.setAttribute('aria-expanded', String(v)); btn.setAttribute('aria-pressed', String(v)); };
  btn.onclick = e => { e.stopPropagation(); setOpen(!pan.classList.contains('open')); };
  // Click-away closes it. A panel that covers a third of the scene and can only
  // be dismissed by finding the button again is a panel people leave open.
  addEventListener('pointerdown', e => {
    if (pan.classList.contains('open') && !pan.contains(e.target) && e.target !== btn) setOpen(false);
  });
  addEventListener('keydown', e => { if (e.key === 'Escape') setOpen(false); });
}

$('#next').onclick = () => go(cur + 1);
$('#prev').onclick = () => go(cur - 1);
$('#play').onclick = () => setPlay(!playing);
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); go(cur + 1); }
  if (e.key === 'ArrowLeft') go(cur - 1);
  if (e.key === 'Escape') $('#prov').classList.remove('on');
});

/* ---- hover readout ------------------------------------------------------ */
{
  const tip = $('#tip');
  const h = new Cesium.ScreenSpaceEventHandler(scene.canvas);
  const byId = new Map(D.drill.holes.map(x => [x.id, x]));
  h.setInputAction(m => {
    const p = scene.pick(m.endPosition);
    const id = p && p.id;
    if (id && id.hole) {
      const H = byId.get(id.hole);
      const lines = [`${H.id}`,
        `${H.status === 'planned' ? 'planned' : H.year} · ${H.zone || 'unassigned'}`,
        `${H.depth} m · ${H.az != null ? H.az.toFixed(0)+'° / '+H.inc.toFixed(0)+'°' : 'no survey'}`];
      if (id.au != null) lines.push(`${id.from}–${id.to} m: ${id.au} g/t Au`);
      tip.innerHTML = `<b>${lines[0]}</b>\n` + lines.slice(1).join('\n');
      tip.style.display = 'block';
      tip.style.left = Math.min(m.endPosition.x + 16, innerWidth - 230) + 'px';
      tip.style.top  = (m.endPosition.y + 16) + 'px';
    } else tip.style.display = 'none';
  }, Cesium.ScreenSpaceEventType.MOUSE_MOVE);
}

/* ---- sources ------------------------------------------------------------ */
/* Built as a string so BOTH the drawer and the text fallback show the same
   audit trail. Two copies of a provenance list is one copy too many — the
   whole point of it is that there is a single answer to where a number came
   from. */
function sourcesHTML() {
  const rows = [
    ['Drill collars & surveys', `q_ddh_collar.csv, q_ddh_survey.csv, q_ddh_desurvey.csv — ${D.drill.holes.length} collars, ${dr.length} drilled and ${pl.length} planned. Traces are the operator's own minimum-curvature desurvey, used as supplied.`],
    ['Assays', `q_ddh_samp_int_assay_i1.csv — ${nf(D.drill.holes.reduce((a,h)=>a+(h.assay?h.assay.length:0),0))} sampled intervals across ${D.drill.holes.filter(h=>h.assay).length} holes, 1983 to 2024.`],
    ['Compositing rule', D.drill.rule + '.'],
    ['Soil geochemistry', `q_samp_pt_assay_soil.csv — ${nf(D.soil.pts.length)} samples, 1973 to 2021, coloured on percentile breaks computed over this survey.`],
    ['Phone build', `On a small screen this deck loads reduced data: geochemical samples at or above the median only (the rest are never drawn), gold only, and geophysics grids at 900 px rather than 2,400. Drilling, claims and every figure quoted are identical to the desktop build.`],
    ['Sample elevations', `895 of ${nf(D.soil.pts.length)} soil samples and 259 of ${nf(D.rock.pts.length)} rock samples carry a recorded elevation; the rest were plotted on a map and never surveyed. All of them are draped on the public DEM rather than mixing surveyed and interpolated heights in one layer.`],
    ['Rock geochemistry', `q_samp_pt_assay_rock.csv — ${nf(D.rock.pts.length)} of ${nf(D.rock.source_rows)} samples. ${D.rock.dropped_offsite} sit hundreds of kilometres off the property and are dropped as transcription errors rather than plotted.`],
    ['Magnetics', '2020 heliborne survey (25 m grid) and 2021 VTEM Plus (10 m), both reduced to pole. Neither covers the claim block alone; their union covers all eleven tenures, so the Magnetics layer draws both, each placed from its own GeoTIFF tags (EPSG:32609) and on its own extent. They are separately levelled — colour is not comparable across the seam between them.'],
    ['Induced polarisation', '2021 ground DCIP over the Walcott lines, inverted — chargeability and resistivity at 25/50/100/150 m. EPSG:3156, placed from the file.'],
    ['VTEM', '2021 VTEM Plus airborne survey — RTP magnetics shown; the DCIP and MVI voxels and isosurfaces in the data room are not yet read.'],
    ['Mineral tenure', `${M.source} via openmaps.gov.bc.ca, ${M.licence}. Queried ${M.as_of.slice(0,10)}. ${M.subject_tenures} tenures held by ${M.subject}, ${ha(M.subject_ha)} ha.`],
    ['District holders', `${DIST.length} registered holders of 2,000 ha or more inside the Toodoggone corridor, consolidated into one block each. Individuals are omitted from the district map; a prospector's two claims are not a neighbour an investor is weighing.`],
    ['Company marks', `Logos for ${Object.keys(D.logos).length} of the ${DIST.length} holders drawn were supplied by Omega Pacific and are used as supplied. A mark is a trademark, so one is shown only where the issuer provided it and only against the holder whose ground it is; every other block carries the registered name as text.`],
    ['Operator names', 'EDITORIAL, not from the register. The register records the registered holder and nothing else, and in the Toodoggone those differ routinely: Sun Summit operates Theory and JD under option from Eagle Plains, and Kemess is Centerra\u2019s mine held by its subsidiary AuRico Metals. Holder names on this map are the register; operator and project names beneath them are ours.'],
    ['Zone outlines', 'The convex hull of each zone\u2019s drilled collars, pushed out 300 m. This is the extent of DRILLING, not a mapped geological contact \u2014 nobody has walked a boundary here. Holes the source left unzoned are assigned to the nearer cluster and flagged as inferred in the data.'],
    ['Terrain & imagery', 'Esri World Elevation 3D and World Imagery. Elevations are the public DEM, not a project survey.'],
  ];
  const pub = (D.drill.published || []).map(p =>
    `<tr><td>${p.hole}</td><td>Reported ${p.reported}. Recomputed from the assay table over ${p.from}–${p.to} m: <b style="color:var(--gold);font-weight:400">${p.check}</b>.</td></tr>`).join('');
  return `
    <h2>What this deck is built from</h2>
    <p class="lede">Every figure on every slide is computed from a file in the Williams data room or read from the BC mineral tenure register. None of it is illustrative and none of it is drawn by hand.</p>
    <h3>Published intercepts, recomputed</h3>
    <p class="note">The two intervals Omega Pacific has reported publicly were recomputed here from the raw sample table. They agree, which is the point: a deck whose headline disagrees with the news release gives a reader no way to tell which one is wrong.</p>
    <table>${pub}</table>
    <h3>Datasets</h3>
    <table>${rows.map(([k,v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('')}</table>
    <h3>Stage</h3>
    <p class="note">Williams is an exploration-stage property. No mineral resource has been estimated and no block model exists, so this deck reports no tonnage, no contained metal and no economics. Drill intercepts are intercepts, not widths of a body, and grades shown along a trace are sample grades, not estimates of the rock between the holes.</p>
    <h3>Not yet read</h3>
    <p class="note">The data room also holds VTEM and DCIP voxels (.omf), magnetic and chargeability isosurfaces (.dxf, 1.4 GB), the 2005 IP survey as a scanned and georeferenced map sheet, and 279 MB of raw magnetic line data. Each is renderable and none of it is in this deck yet.</p>`;
}

{
  $('#prov_in').innerHTML = sourcesHTML();
  $('#prov_o').onclick = () => { $('#prov').classList.add('on'); $('#prov_c').focus(); };
  $('#prov_c').onclick = () => $('#prov').classList.remove('on');
}

if (new URLSearchParams(location.search).get('admin') === '1') toggleEditor(true);

stat('placing the camera…');
await go(0, true);
setTimeout(() => { $('#stat').classList.add('gone');
  setTimeout(() => $('#stat').style.display = 'none', 600); }, 700);
</script>
